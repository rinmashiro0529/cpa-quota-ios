name: Final main unsigned IPA

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: final-main-ipa-20261030-0039
  cancel-in-progress: false

jobs:
  archive:
    if: github.repository == 'rinmashiro0529/cpa-quota-ios' && github.ref == 'refs/heads/ci/final-main-ipa-20261030-0039'
    runs-on: macos-15
    permissions:
      contents: write
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
      SOURCE_SHA: d6d18dce184b8b611c831a0c065ca1365ea0392b
      SOURCE_TREE: 6772e5d1fa754336649e61179863a2ebbbca5047
    steps:
      - name: Check out exact final main source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: d6d18dce184b8b611c831a0c065ca1365ea0392b
          persist-credentials: false

      - name: Verify frozen source and toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$SOURCE_TREE"
          test -z "$(git status --porcelain)"
          mkdir -p "$RUNNER_TEMP/final-ipa-output"
          xcodebuild -version
          xcrun swift --version
          python3 -I -B ci/validate_source_layout.py --root .

      - name: Archive final main for physical iOS without signing
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/final-ipa-output"
          xcodebuild archive \
            -project Apple/CPAQuota.xcodeproj \
            -scheme CPAQuota \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/CPAQuota.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/FinalMainDerivedData" \
            ONLY_ACTIVE_ARCH=NO APS_ENVIRONMENT=development \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= \
            2>&1 | tee "$OUT/xcodebuild-archive.log"

      - name: Validate archive and real embedded device extension
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/final-ipa-output"
          python3 -I -B ci/validate_archive.py \
            --archive "$RUNNER_TEMP/CPAQuota.xcarchive" \
            --source-root . \
            --report "$OUT/archive-validation.json" \
            --sha-manifest "$OUT/swift-sources.sha256" \
            --expected-swift-count "$(python3 -I -B ci/validate_source_layout.py --root . --emit-count)"
          python3 -I -B ci/validate_activity_extension.py \
            --app "$RUNNER_TEMP/CPAQuota.xcarchive/Products/Applications/CPAQuota.app" \
            --platform ios | tee "$OUT/activity-extension-validation.json"
          git diff --exit-code HEAD

      - name: Package unsigned IPA and archive with provenance
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/final-ipa-output"
          mkdir -p "$RUNNER_TEMP/final-ipa-stage/Payload"
          /usr/bin/ditto "$RUNNER_TEMP/CPAQuota.xcarchive/Products/Applications/CPAQuota.app" \
            "$RUNNER_TEMP/final-ipa-stage/Payload/CPAQuota.app"
          /usr/bin/ditto -c -k --norsrc --keepParent \
            "$RUNNER_TEMP/final-ipa-stage/Payload" "$OUT/CPAQuota-final-main-unsigned.ipa"
          tar -czf "$OUT/CPAQuota-final-main-unsigned.xcarchive.tar.gz" \
            -C "$RUNNER_TEMP" CPAQuota.xcarchive
          python3 -I -c 'import json,os,sys; from pathlib import Path; record={"source_commit":os.environ["SOURCE_SHA"],"source_tree":os.environ["SOURCE_TREE"],"workflow_commit":os.environ["GITHUB_SHA"],"workflow_ref":os.environ["GITHUB_REF"],"run_id":os.environ["GITHUB_RUN_ID"],"configuration":"Release","platform":"ios","aps_environment_build_setting":"development","archive_and_embedded_extension_validated":True,"signed":False,"installed":False,"testflight_uploaded":False}; Path(sys.argv[1]).write_text(json.dumps(record,sort_keys=True,indent=2)+"\n",encoding="utf-8")' "$OUT/build-provenance.json"
          cd "$OUT"
          shasum -a 256 CPAQuota-final-main-unsigned.ipa \
            CPAQuota-final-main-unsigned.xcarchive.tar.gz archive-validation.json \
            activity-extension-validation.json swift-sources.sha256 \
            build-provenance.json xcodebuild-archive.log > SHA256SUMS.txt

      - name: Transfer unsigned products through a private draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$(gh repo view "$GH_REPO" --json isPrivate --jq '.isPrivate')" = true
          OUT="$RUNNER_TEMP/final-ipa-output"
          TAG="final-main-unsigned-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$TAG" \
            "$OUT/CPAQuota-final-main-unsigned.ipa" \
            "$OUT/CPAQuota-final-main-unsigned.xcarchive.tar.gz" \
            "$OUT/archive-validation.json" \
            "$OUT/activity-extension-validation.json" \
            "$OUT/swift-sources.sha256" \
            "$OUT/build-provenance.json" \
            "$OUT/xcodebuild-archive.log" \
            "$OUT/SHA256SUMS.txt" \
            --repo "$GH_REPO" --target "$SOURCE_SHA" --draft \
            --title "Private unsigned final-main build $GITHUB_RUN_ID" \
            --notes "Private draft used only to transfer unsigned build outputs after Actions artifact quota was exhausted. Source: $SOURCE_SHA. Not signed, not installed, not a public release and not uploaded to TestFlight. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID."
          gh release view "$TAG" --repo "$GH_REPO" --json isDraft,tagName,targetCommitish,assets,url
