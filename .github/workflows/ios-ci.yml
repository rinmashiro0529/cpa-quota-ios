name: iOS unsigned archive

on:
  push:
    branches:
      - ci/macos-build-20261026
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-archive-${{ github.ref }}
  cancel-in-progress: true

jobs:
  archive:
    if: github.repository == 'rinmashiro0529/cpa-quota-ios' && github.ref == 'refs/heads/ci/macos-build-20261026'
    permissions:
      contents: write
    runs-on: macos-15
    timeout-minutes: 10
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Report toolchain versions
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun swift --version
          SDK_VERSION="$(xcrun --sdk iphoneos --show-sdk-version)"
          printf 'iOS SDK: %s\n' "$SDK_VERSION"
          python3 -c 'import sys; v=tuple(map(int, sys.argv[1].split("."))); sys.exit(0 if v >= (26, 0) else "iOS SDK 26.0 or newer is required")' "$SDK_VERSION"

      - name: Run iOS simulator tests
        shell: bash
        run: |
          set -euo pipefail
          SIMULATOR_UDID="$(xcrun simctl list devices available --json | python3 -c 'import json, sys; devices=json.load(sys.stdin).get("devices", {}); candidates=[device for runtime, group in devices.items() if runtime.startswith("com.apple.CoreSimulator.SimRuntime.iOS-") for device in group if device.get("isAvailable") and device.get("name", "").startswith("iPhone")]; sys.exit("No available iPhone simulator was found") if not candidates else print(candidates[0]["udid"])')"
          test -n "$SIMULATOR_UDID"
          xcodebuild test \
            -project Apple/CPAQuota.xcodeproj \
            -scheme CPAQuota \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath "$RUNNER_TEMP/TestDerivedData" \
            -parallel-testing-enabled NO \
            -collect-test-diagnostics never \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            2>&1 | tee "$RUNNER_TEMP/swift-test.log"

      - name: Create unsigned archive
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE_PATH="$RUNNER_TEMP/CPAQuota.xcarchive"
          LOG_PATH="$RUNNER_TEMP/xcodebuild-archive.log"
          xcodebuild archive \
            -project Apple/CPAQuota.xcodeproj \
            -scheme CPAQuota \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            2>&1 | tee "$LOG_PATH"

      - name: Validate archive and hash Swift sources
        shell: bash
        run: |
          set -euo pipefail
          python3 -I ci/validate_archive.py \
            --archive "$RUNNER_TEMP/CPAQuota.xcarchive" \
            --source-root . \
            --report "$RUNNER_TEMP/archive-validation.json" \
            --sha-manifest "$RUNNER_TEMP/swift-sources.sha256" \
            --expected-swift-count 39

      - name: Package unsigned archive
        shell: bash
        run: |
          set -euo pipefail
          tar -czf "$RUNNER_TEMP/CPAQuota-unsigned.xcarchive.tar.gz" \
            -C "$RUNNER_TEMP" CPAQuota.xcarchive
          cd "$RUNNER_TEMP"
          shasum -a 256 CPAQuota-unsigned.xcarchive.tar.gz archive-validation.json \
            swift-sources.sha256 xcodebuild-archive.log swift-test.log > SHA256SUMS

      - name: Save unsigned archive to private draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ci-unsigned-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          test "$(gh repo view "$GH_REPO" --json isPrivate --jq '.isPrivate')" = true
          gh release create "$RELEASE_TAG" \
            "$RUNNER_TEMP/CPAQuota-unsigned.xcarchive.tar.gz" \
            "$RUNNER_TEMP/archive-validation.json" \
            "$RUNNER_TEMP/swift-sources.sha256" \
            "$RUNNER_TEMP/xcodebuild-archive.log" \
            "$RUNNER_TEMP/swift-test.log" \
            "$RUNNER_TEMP/SHA256SUMS" \
            --repo "$GH_REPO" \
            --target "$GITHUB_SHA" \
            --draft \
            --title "CPA Quota unsigned CI $GITHUB_RUN_ID attempt $GITHUB_RUN_ATTEMPT" \
            --notes "Private CI build verification archive. Includes xcodebuild iOS Simulator test results. Unsigned; not uploaded to TestFlight. Source commit: $GITHUB_SHA. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID."
          gh release view "$RELEASE_TAG" --repo "$GH_REPO" \
            --json isDraft,tagName,targetCommitish,assets,url
