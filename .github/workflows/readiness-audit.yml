name: Public readiness audit

on:
  pull_request:
  push:
    branches: [main, fix/readiness-hardening-20261108]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-readiness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Source and history secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact candidate and history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Include all public refs on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags "https://github.com/${GITHUB_REPOSITORY}.git" '+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*' '+refs/pull/*/head:refs/remotes/pull/*'
      - name: Install checksum-verified Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/Scanner" "$RUNNER_TEMP/SecretEvidence"
          cd "$RUNNER_TEMP/Scanner"
          curl --fail --location --silent --show-error --max-time 120 --proto '=https' --tlsv1.2 -o scanner.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  scanner.tar.gz' | sha256sum --check --status
          tar -xzf scanner.tar.gz gitleaks
          ./gitleaks version > "$RUNNER_TEMP/SecretEvidence/scanner-version.txt"
      - name: Run scanner-gate regressions
        run: python3 -I -B -m unittest discover -s tools/tests -p 'test_secret_scan.py'
      - name: Scan tracked snapshot and merge-aware history
        shell: bash
        env:
          SCAN_ALL_REFS: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          set -euo pipefail
          SCOPE=()
          if [ "$SCAN_ALL_REFS" = true ]; then SCOPE+=(--all-refs); fi
          git for-each-ref --format='%(objectname) %(refname)' > "$RUNNER_TEMP/SecretEvidence/refs.txt"
          python3 -I -B ci/scan_secrets.py --scanner "$RUNNER_TEMP/Scanner/gitleaks" --report "$RUNNER_TEMP/SecretEvidence/scan-summary.json" "${SCOPE[@]}"
      - name: Preserve metadata only, never raw findings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: secret-scan-metadata-${{ github.run_attempt }}
          path: ${{ runner.temp }}/SecretEvidence
          retention-days: 7
          if-no-files-found: error
