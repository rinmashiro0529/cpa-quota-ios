name: Stage verified readiness changes
on:
  push:
    branches: [fix/readiness-hardening-20261108]
permissions:
  contents: read
jobs:
  prepare:
    if: github.repository == 'rinmashiro0529/cpa-quota-ios' && github.ref == 'refs/heads/fix/readiness-hardening-20261108'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Verify and apply the fixed reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          python3 -I - <<'PY'
          import base64, gzip, hashlib, os, subprocess
          from pathlib import Path
          parts = sorted(Path('.hardening-transfer').glob('part-*'))
          assert len(parts) == 18
          compressed = base64.b64decode(''.join(p.read_text() for p in parts), validate=True)
          assert hashlib.sha256(compressed).hexdigest() == '2248f40c1f2ab1dfddf4d57a15353fa2a3b1f69f7a067b795d37c59dff50bb86'
          patch = gzip.decompress(compressed)
          assert len(patch) == 84310
          path = Path(os.environ['RUNNER_TEMP']) / 'verified.patch'
          path.write_bytes(patch)
          subprocess.run(['git','apply','--check',str(path)], check=True, timeout=30)
          subprocess.run(['git','apply','--index',str(path)], check=True, timeout=30)
          PY
          git rm -r -- .hardening-transfer .github/workflows/apply-verified-hardening.yml
          python3 -I -B -m unittest discover -s tools/tests -p 'test_*.py'
          python3 -I -B ci/validate_source_layout.py --root .
          python3 -I -B ci/test_source_layout.py
          python3 -I -B ci/test_activity_extension.py
          python3 -I -B ci/validate_public_copy.py --root .
          git diff HEAD --check
      - name: Create candidate objects without moving any branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -I - <<'PY'
          import base64, hashlib, json, os, subprocess, urllib.request
          from pathlib import Path
          repo = 'rinmashiro0529/cpa-quota-ios'
          parent = os.environ['GITHUB_SHA']
          def git(*args):
              return subprocess.check_output(['git',*args], timeout=30)
          def api(path, value):
              req = urllib.request.Request('https://api.github.com/repos/' + repo + path,
                  data=json.dumps(value).encode(), method='POST', headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'})
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)
          entries = []; changed = {}
          for raw in git('diff','HEAD','--name-only','-z').split(b'\0'):
              if not raw: continue
              name = raw.decode(); path = Path(name)
              if not path.exists():
                  entries.append({'path':name,'mode':'100644','type':'blob','sha':None})
                  continue
              assert path.is_file() and not path.is_symlink()
              data = path.read_bytes(); assert len(data) < 500000
              blob = api('/git/blobs', {'content':base64.b64encode(data).decode(),'encoding':'base64'})['sha']
              expected = hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              assert blob == expected
              entries.append({'path':name,'mode':'100644','type':'blob','sha':blob})
              changed[name] = blob
          assert len(changed) == 26
          base = git('rev-parse','HEAD^{tree}').decode().strip()
          tree = api('/git/trees', {'base_tree':base,'tree':entries})['sha']
          message = 'Harden time and cooldown projections; add verified history and Duo evidence gates'
          commit = api('/git/commits', {'message':message,'tree':tree,'parents':[parent]})['sha']
          output = Path(os.environ['RUNNER_TEMP']) / 'CandidateEvidence'
          output.mkdir()
          (output/'candidate.json').write_text(json.dumps({'parent':parent,'candidate':commit,'tree':tree,'files':changed,'branchUpdated':False},indent=2)+'\n')
          print('Created verified candidate objects; no branch reference was updated.')
          print('CANDIDATE_COMMIT=' + commit)
          PY
      - name: Preserve candidate receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: readiness-candidate-receipt
          path: ${{ runner.temp }}/CandidateEvidence
          retention-days: 3
          if-no-files-found: error
