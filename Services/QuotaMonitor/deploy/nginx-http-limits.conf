# Include once in nginx's http context, before either monitor location template.
# Empty keys are not counted. DELETE and PUT have their own budget so a refresh
# burst cannot consume the cancellation/token-rotation allowance.
map $request_method $quota_monitor_request_ip {
    default $binary_remote_addr;
    DELETE "";
    PUT "";
}

map $request_method $quota_monitor_control_ip {
    default "";
    DELETE $binary_remote_addr;
    PUT $binary_remote_addr;
}

limit_req_zone $quota_monitor_request_ip zone=quota_monitor_requests:1m rate=5r/s;
limit_req_zone $quota_monitor_control_ip zone=quota_monitor_controls:1m rate=20r/s;
