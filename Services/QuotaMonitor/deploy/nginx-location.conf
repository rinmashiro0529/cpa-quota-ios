# Alternative to nginx-prefix-location.conf; do not enable both for the same service.
# Include inside a dedicated TLS server for monitor.example.invalid.
# This server must not expose the loopback upstream directly.
location / {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    client_max_body_size 64k;
}
