# Alternative to nginx-prefix-location.conf; do not enable both for the same service.
# Include inside a dedicated TLS server for monitor.example.invalid.
# This server must not expose the loopback upstream directly.
# Requires nginx-http-limits.conf in the parent http context.
location / {
    limit_req zone=quota_monitor_requests burst=10 nodelay;
    limit_req zone=quota_monitor_controls burst=20 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Connection "";
    client_max_body_size 64k;
    proxy_read_timeout 300s;
    proxy_cache off;
    access_log off;
    add_header Cache-Control "no-store" always;
}
